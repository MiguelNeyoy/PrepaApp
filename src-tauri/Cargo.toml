[package]
name = "app-titulacion"
version = "0.0.1"
description = "APP Titulación"
authors = ["APP Titulación"]
edition = "2021"

[lib]
name = "app_titulacion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
